name: Generate telemetry and serpent

on:
  schedule:
    - cron: "0 6 * * *" # daily, 6:00 UTC — the dawn shift-change
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  serpent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render in-house telemetry cards
        run: node scripts/telemetry.mjs
        env:
          # PROFILE_STATS_TOKEN is an optional classic PAT (repo + read:user) so the
          # card can count private PRs/contributions. Falls back to the default
          # token (public data only) when the secret isn't set — nothing breaks.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      - name: Generate snake in Neo-Atlantis palette
        uses: Platane/snk@v3
        with:
          github_user_name: mikedorado
          outputs: |
            dist/serpent.svg?color_snake=#FFD98A&color_dots=#0A1626,#123B4A,#1F6E73,#7FD4CE,#EAFFFB
            dist/serpent-dark.svg?palette=github-dark&color_snake=#FFD98A&color_dots=#0A1626,#123B4A,#1F6E73,#7FD4CE,#EAFFFB

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
