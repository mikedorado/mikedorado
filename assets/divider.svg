<svg viewBox="0 0 1200 30" width="1200" height="30" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="glowing divider">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B054" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E8B054" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFD98A" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#E8B054" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E8B054" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FD4CE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EAFFFB" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7FD4CE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="travel"><rect x="70" y="0" width="1060" height="30"/></clipPath>
    <style><![CDATA[
      @keyframes slide { from { transform: translateX(-140px); } to { transform: translateX(1200px); } }
      .pulse-rect { animation: slide 5s linear infinite; }
      @keyframes gemPulse { from { opacity: 0.55; } to { opacity: 1; } }
      .gem { animation: gemPulse 2.4s ease-in-out infinite alternate; }
    ]]></style>
  </defs>
  <line x1="70" y1="15" x2="1130" y2="15" stroke="url(#lineGrad)" stroke-width="1.4"/>
  <g clip-path="url(#travel)">
    <rect class="pulse-rect" x="0" y="13.8" width="140" height="2.4" fill="url(#pulseG)"/>
  </g>
  <g class="gem">
    <rect x="595.5" y="10.5" width="9" height="9" transform="rotate(45 600 15)" fill="none" stroke="#FFD98A" stroke-width="1.3"/>
    <rect x="598.2" y="13.2" width="3.6" height="3.6" transform="rotate(45 600 15)" fill="#FFD98A"/>
  </g>
  <text x="44" y="20" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="15" fill="#7FD4CE" opacity="0.6">Ψ</text>
  <text x="1156" y="20" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="15" fill="#7FD4CE" opacity="0.6">Ψ</text>
</svg>
