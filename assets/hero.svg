<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Mike Dorado — Atlantean glyph rain falling onto a glowing grid, deep-sea aqua and orichalcum gold">
  <title>Mike Dorado — Neo-Atlantis Grid</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02070F"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#10263F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="55%" stop-color="#E8B054"/>
      <stop offset="100%" stop-color="#C98A2E"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02070F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#02070F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1D33" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1D33" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="horizFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FFD98A" stop-opacity="1"/>
      <stop offset="82%" stop-color="#FFD98A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD98A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCF8A" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#E8A24B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8A24B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BFE3E8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EAFFFB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BFE3E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fAqua" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rainClip"><rect x="0" y="0" width="1200" height="312"/></clipPath>
    <clipPath id="gridClip"><rect x="0" y="312" width="1200" height="108"/></clipPath>
    <clipPath id="typeClip">
      <rect x="390" y="238" height="24" width="0">
        <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.42;0.96;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <pattern id="scan" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#9FE8E0" opacity="0.035"/>
    </pattern>

    <text id="colA" font-family="'Courier New',Courier,monospace" font-size="17" fill="#5FC9C0">
      <tspan x="0" y="0" opacity="0.5">Ψ</tspan>
      <tspan x="0" y="22" opacity="0.75">Δ</tspan>
      <tspan x="0" y="44" opacity="0.4">Θ</tspan>
      <tspan x="0" y="66" fill="#EAFFFB" opacity="0.95">Λ</tspan>
      <tspan x="0" y="88" opacity="0.6">Σ</tspan>
      <tspan x="0" y="110" opacity="0.35">Ω</tspan>
      <tspan x="0" y="132" fill="#FFD98A" opacity="0.85">Ξ</tspan>
      <tspan x="0" y="154" opacity="0.55">Α</tspan>
      <tspan x="0" y="176" opacity="0.7">Φ</tspan>
      <tspan x="0" y="198" opacity="0.4">Π</tspan>
      <tspan x="0" y="220" opacity="0.6">Τ</tspan>
      <tspan x="0" y="242" fill="#EAFFFB" opacity="0.9">Ν</tspan>
      <tspan x="0" y="264" opacity="0.45">Δ</tspan>
      <tspan x="0" y="286" opacity="0.7">Ψ</tspan>
      <tspan x="0" y="308" opacity="0.35">Σ</tspan>
      <tspan x="0" y="330" fill="#FFD98A" opacity="0.75">Θ</tspan>
      <tspan x="0" y="352" opacity="0.55">Ω</tspan>
      <tspan x="0" y="374" opacity="0.65">Λ</tspan>
      <tspan x="0" y="396" opacity="0.4">Ξ</tspan>
      <tspan x="0" y="418" opacity="0.6">Φ</tspan>
    </text>
    <text id="colB" font-family="'Courier New',Courier,monospace" font-size="17" fill="#5FC9C0">
      <tspan x="0" y="0" opacity="0.65">Ω</tspan>
      <tspan x="0" y="22" opacity="0.4">Ν</tspan>
      <tspan x="0" y="44" fill="#FFD98A" opacity="0.8">Φ</tspan>
      <tspan x="0" y="66" opacity="0.55">Σ</tspan>
      <tspan x="0" y="88" opacity="0.7">Ψ</tspan>
      <tspan x="0" y="110" fill="#EAFFFB" opacity="0.9">Τ</tspan>
      <tspan x="0" y="132" opacity="0.45">Δ</tspan>
      <tspan x="0" y="154" opacity="0.6">Ξ</tspan>
      <tspan x="0" y="176" opacity="0.35">Θ</tspan>
      <tspan x="0" y="198" opacity="0.75">Α</tspan>
      <tspan x="0" y="220" opacity="0.5">Λ</tspan>
      <tspan x="0" y="242" opacity="0.65">Π</tspan>
      <tspan x="0" y="264" fill="#FFD98A" opacity="0.7">Σ</tspan>
      <tspan x="0" y="286" opacity="0.4">Ω</tspan>
      <tspan x="0" y="308" opacity="0.6">Δ</tspan>
      <tspan x="0" y="330" fill="#EAFFFB" opacity="0.85">Ψ</tspan>
      <tspan x="0" y="352" opacity="0.5">Ν</tspan>
      <tspan x="0" y="374" opacity="0.35">Θ</tspan>
      <tspan x="0" y="396" opacity="0.7">Φ</tspan>
      <tspan x="0" y="418" opacity="0.55">Τ</tspan>
    </text>

    <style><![CDATA[
      @keyframes fallAnim { from { transform: translateY(0); } to { transform: translateY(440px); } }
      .fall { animation: fallAnim 10s linear infinite; }
      .s1 { animation-duration: 8s; }
      .s2 { animation-duration: 10.5s; }
      .s3 { animation-duration: 13s; }
      .s4 { animation-duration: 9s; }
      .s5 { animation-duration: 15s; }
      .s6 { animation-duration: 11.5s; }

      @keyframes glide {
        0%   { transform: translateY(0);     opacity: 0;    stroke-width: 0.4; }
        10%  { opacity: 0.55; }
        100% { transform: translateY(108px); opacity: 0.85; stroke-width: 2.6; }
      }
      .hl { animation: glide 3.6s cubic-bezier(0.5, 0.05, 0.9, 0.4) infinite; }

      @keyframes ringPulse { from { transform: scale(1); } to { transform: scale(1.03); } }
      .pulse { animation: ringPulse 6s ease-in-out infinite alternate; transform-origin: 600px 170px; }
      @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .rotSlow { animation: rot 60s linear infinite; transform-origin: 600px 170px; }
      .rotRev  { animation: rot 45s linear infinite reverse; transform-origin: 600px 170px; }

      @keyframes glowPulse { from { opacity: 0.35; } to { opacity: 0.8; } }
      .glowT { animation: glowPulse 4s ease-in-out infinite alternate; }

      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .blink { animation: blink 1s step-end infinite; }

      @keyframes ferryE { from { transform: translateX(-80px); } to { transform: translateX(1300px); } }
      @keyframes ferryW { from { transform: translateX(1280px); } to { transform: translateX(-100px); } }
      .ferry1 { animation: ferryE 19s linear infinite; }
      .ferry2 { animation: ferryW 27s linear infinite; }
    ]]></style>
  </defs>

  <!-- deep-sea backdrop -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- glyph rain -->
  <g clip-path="url(#rainClip)">
    <g transform="translate(40,0)" opacity="0.55"><g class="fall s1" style="animation-delay:-1.2s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(118,0) scale(0.85)" opacity="0.4"><g class="fall s3" style="animation-delay:-4s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(196,0) scale(1.1)" opacity="0.7"><g class="fall s2" style="animation-delay:-2.5s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(275,0) scale(0.9)" opacity="0.5"><g class="fall s4" style="animation-delay:-0.8s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(350,0) scale(0.8)" opacity="0.35"><g class="fall s5" style="animation-delay:-6s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(430,0)" opacity="0.6"><g class="fall s1" style="animation-delay:-3.4s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(510,0) scale(0.95)" opacity="0.45"><g class="fall s3" style="animation-delay:-1.7s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(595,0) scale(0.8)" opacity="0.35"><g class="fall s6" style="animation-delay:-5.2s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(675,0) scale(1.05)" opacity="0.6"><g class="fall s2" style="animation-delay:-0.4s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(755,0) scale(0.9)" opacity="0.5"><g class="fall s4" style="animation-delay:-2.9s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(835,0)" opacity="0.65"><g class="fall s1" style="animation-delay:-4.6s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(915,0) scale(0.85)" opacity="0.4"><g class="fall s5" style="animation-delay:-1.1s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(995,0) scale(1.1)" opacity="0.7"><g class="fall s3" style="animation-delay:-3.8s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <g transform="translate(1075,0) scale(0.9)" opacity="0.5"><g class="fall s2" style="animation-delay:-0.2s"><use href="#colB" y="-440"/><use href="#colB"/></g></g>
    <g transform="translate(1150,0) scale(0.95)" opacity="0.55"><g class="fall s6" style="animation-delay:-2.2s"><use href="#colA" y="-440"/><use href="#colA"/></g></g>
    <!-- dissolve rain into sky and horizon -->
    <rect x="0" y="0" width="1200" height="60" fill="url(#fadeTop)"/>
    <rect x="0" y="238" width="1200" height="74" fill="url(#fadeBot)"/>
  </g>

  <!-- orichalcum horizon glow: dawn -->
  <ellipse cx="600" cy="312" rx="560" ry="95" fill="url(#hGlow)"/>
  <ellipse cx="600" cy="312" rx="260" ry="48" fill="url(#hGlow)"/>

  <!-- the grid -->
  <g clip-path="url(#gridClip)">
    <g stroke="#3FA9A0">
      <path d="M600 312 L-320 424" opacity="0.18" stroke-width="1.2"/>
      <path d="M600 312 L-205 424" opacity="0.22" stroke-width="1.2"/>
      <path d="M600 312 L-90 424" opacity="0.26" stroke-width="1.2"/>
      <path d="M600 312 L25 424" opacity="0.3" stroke-width="1.2"/>
      <path d="M600 312 L140 424" opacity="0.34" stroke-width="1.2"/>
      <path d="M600 312 L255 424" opacity="0.38" stroke-width="1.3"/>
      <path d="M600 312 L370 424" opacity="0.42" stroke-width="1.3"/>
      <path d="M600 312 L485 424" opacity="0.46" stroke-width="1.4"/>
      <path d="M600 312 L600 424" opacity="0.5" stroke-width="1.4"/>
      <path d="M600 312 L715 424" opacity="0.46" stroke-width="1.4"/>
      <path d="M600 312 L830 424" opacity="0.42" stroke-width="1.3"/>
      <path d="M600 312 L945 424" opacity="0.38" stroke-width="1.3"/>
      <path d="M600 312 L1060 424" opacity="0.34" stroke-width="1.2"/>
      <path d="M600 312 L1175 424" opacity="0.3" stroke-width="1.2"/>
      <path d="M600 312 L1290 424" opacity="0.26" stroke-width="1.2"/>
      <path d="M600 312 L1405 424" opacity="0.22" stroke-width="1.2"/>
      <path d="M600 312 L1520 424" opacity="0.18" stroke-width="1.2"/>
    </g>
    <g stroke="#7FD4CE">
      <line class="hl" style="animation-delay:0s" x1="0" y1="312" x2="1200" y2="312"/>
      <line class="hl" style="animation-delay:-0.6s" x1="0" y1="312" x2="1200" y2="312"/>
      <line class="hl" style="animation-delay:-1.2s" x1="0" y1="312" x2="1200" y2="312"/>
      <line class="hl" style="animation-delay:-1.8s" x1="0" y1="312" x2="1200" y2="312"/>
      <line class="hl" style="animation-delay:-2.4s" x1="0" y1="312" x2="1200" y2="312"/>
      <line class="hl" style="animation-delay:-3.0s" x1="0" y1="312" x2="1200" y2="312"/>
    </g>
  </g>

  <!-- horizon line -->
  <line x1="0" y1="312" x2="1200" y2="312" stroke="url(#horizFade)" stroke-width="6" opacity="0.22"/>
  <line x1="0" y1="312" x2="1200" y2="312" stroke="url(#horizFade)" stroke-width="1.6" opacity="0.95" filter="url(#fGold)"/>

  <!-- ring ferries with phosphorescent wakes -->
  <g class="ferry1"><line x1="-46" y1="309" x2="-6" y2="309" stroke="#7FD4CE" stroke-width="1" opacity="0.35"/><circle cx="0" cy="309" r="2.2" fill="#FFD98A" filter="url(#fAqua)"/></g>
  <g class="ferry2"><line x1="6" y1="316" x2="46" y2="316" stroke="#7FD4CE" stroke-width="1" opacity="0.35"/><circle cx="0" cy="316" r="1.8" fill="#FFCF8A" filter="url(#fAqua)"/></g>

  <!-- concentric ring emblem: a dawn sun rising from the horizon -->
  <g clip-path="url(#rainClip)">
    <g class="pulse">
      <g class="rotSlow"><circle cx="600" cy="170" r="185" fill="none" stroke="#2E6E75" stroke-width="1" opacity="0.5" stroke-dasharray="3 9"/></g>
      <g class="rotRev"><circle cx="600" cy="170" r="150" fill="none" stroke="#FFD98A" stroke-width="0.8" opacity="0.3" stroke-dasharray="1 6"/></g>
      <circle cx="600" cy="170" r="120" fill="none" stroke="#7FD4CE" stroke-width="1" opacity="0.3"/>
      <circle cx="600" cy="170" r="95" fill="none" stroke="#E8B054" stroke-width="1" opacity="0.32"/>
      <circle cx="600" cy="170" r="72" fill="none" stroke="#7FD4CE" stroke-width="0.8" opacity="0.25"/>
    </g>
  </g>

  <!-- name -->
  <text class="glowT" x="600" y="193" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="12" fill="#E8B054" filter="url(#fGold)">MIKE DORADO</text>
  <text x="600" y="193" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="700" letter-spacing="12" fill="url(#goldGrad)">MIKE DORADO</text>

  <!-- subtitle -->
  <text x="600" y="226" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="13" letter-spacing="5" fill="#8FD8D2" opacity="0.9">AI AGENTS ⟡ CLOUD INFRASTRUCTURE ⟡ COMMUNITY</text>

  <!-- typing tagline -->
  <text x="394" y="256" font-family="'Courier New',Courier,monospace" font-size="16" fill="#A8EFE8" clip-path="url(#typeClip)">&gt; building the future in full working order</text>
  <rect class="blink" y="242" width="9" height="17" fill="#FFD98A" opacity="0.9">
    <animate attributeName="x" values="394;807;807;394" keyTimes="0;0.42;0.96;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#7FD4CE" stroke-width="1.4" opacity="0.45" fill="none">
    <path d="M20 46 V20 H46"/>
    <path d="M1154 20 H1180 V46"/>
    <path d="M20 374 V400 H46"/>
    <path d="M1154 400 H1180 V374"/>
  </g>
  <text x="60" y="34" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#7FD4CE" opacity="0.6">◈ MIKEDORADO // GRID 01</text>
  <text x="1140" y="34" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#FFD98A" opacity="0.6">SYSTEMS: ONLINE <tspan class="blink">●</tspan></text>
  <text x="60" y="396" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#FFD98A" opacity="0.5">33.68N 117.82W // IRVINE, CA</text>
  <text x="1140" y="396" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="11" letter-spacing="2" fill="#7FD4CE" opacity="0.55">ALL SYSTEMS NOMINAL</text>

  <!-- scanline film -->
  <rect width="1200" height="420" fill="url(#scan)"/>
</svg>
