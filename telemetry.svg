    @keyframes dial { from { opacity: .55; } to { opacity: 1; } }
    .dial { animation: dial 3s ease-in-out infinite alternate; }
  </style>
  <defs>
    <linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7FD4CE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EAFFFB" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#7FD4CE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect width="420" height="195" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="420" height="195" rx="10" fill="#0A1626"/>
    <text x="22" y="34" font-family="'Courier New',Courier,monospace" font-size="14" font-weight="bold" letter-spacing="3" fill="#FFD98A">◈ GRID TELEMETRY</text>
    <line x1="22" y1="46" x2="398" y2="46" stroke="#122A44" stroke-width="1.4"/>
    <rect class="sweep" x="0" y="45.4" width="160" height="1.2" fill="url(#sweepG)"/>
    <text x="26" y="72" font-family="'Courier New',Courier,monospace" font-size="13" fill="#7FD4CE">Ψ</text>
    <text x="48" y="72" font-family="'Courier New',Courier,monospace" font-size="12" letter-spacing="1.5" fill="#BFE3E8">PUBLIC REPOS</text>
    <text x="250" y="72" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#FFD98A">6</text>
<text x="26" y="96" font-family="'Courier New',Courier,monospace" font-size="13" fill="#7FD4CE">Δ</text>
    <text x="48" y="96" font-family="'Courier New',Courier,monospace" font-size="12" letter-spacing="1.5" fill="#BFE3E8">PULL REQUESTS</text>
    <text x="250" y="96" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#FFD98A">307</text>
<text x="26" y="120" font-family="'Courier New',Courier,monospace" font-size="13" fill="#7FD4CE">⟡</text>
    <text x="48" y="120" font-family="'Courier New',Courier,monospace" font-size="12" letter-spacing="1.5" fill="#BFE3E8">FOLLOWERS</text>
