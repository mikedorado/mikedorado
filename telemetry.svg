  <g class="dial">
    <circle cx="338" cy="120" r="52" fill="none" stroke="#2E6E75" stroke-width="1" opacity=".6" stroke-dasharray="3 6"/>
    <circle cx="338" cy="120" r="44" fill="none" stroke="#E8B054" stroke-width="1.2" opacity=".55"/>
    <circle cx="338" cy="120" r="36" fill="none" stroke="#7FD4CE" stroke-width="1" opacity=".4"/>
  </g>
  <text x="338" y="118" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="19" font-weight="bold" fill="#EAFFFB">785</text>
  <text x="338" y="136" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8.5" letter-spacing="1" fill="#7FD4CE">CONTRIBUTIONS</text>
  <text x="338" y="147" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8.5" letter-spacing="1" fill="#7FD4CE">PAST YEAR</text><text x="26" y="183" font-family="'Courier New',Courier,monospace" font-size="9" letter-spacing="1" fill="#2E6E75">SRC: GITHUB GRAPHQL // RENDERED IN-HOUSE</text>
