<svg viewBox="0 0 420 195" width="420" height="195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GRID TELEMETRY">
  <style>
    @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(580px); } }
